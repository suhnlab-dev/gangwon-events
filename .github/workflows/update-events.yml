name: Update Gangwon events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch KTO events
        env:
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timedelta

          key = os.environ["KTO_API_KEY"]

          if not key:
              raise RuntimeError("KTO_API_KEY Secret이 없습니다.")

          base_url = "https://apis.data.go.kr/B551011/KorService2/searchFestival2"

          # 우리가 원하는 최종 범위
          min_date = "20260101"
          max_date = (
              datetime.now() + timedelta(days=365)
          ).strftime("%Y%m%d")

          print("최종 데이터 범위:", min_date, "~", max_date)

          all_items = []

          # 한 번에 100개씩 받아오기
          num_of_rows = 100
          page = 1

          while True:

              params = {
                  "MobileOS": "ETC",
                  "MobileApp": "GangwonEvents",
                  "_type": "json",
                  "numOfRows": str(num_of_rows),
                  "pageNo": str(page),
                  "areaCode": "32",
                  "eventStartDate": min_date
              }

              query = urllib.parse.urlencode(params)

              if "%" in key:
                  request_url = (
                      base_url
                      + "?serviceKey="
                      + key
                      + "&"
                      + query
                  )
              else:
                  request_url = (
                      base_url
                      + "?"
                      + urllib.parse.urlencode(
                          {"serviceKey": key}
                      )
                      + "&"
                      + query
                  )

              print("페이지 요청:", page)

              request = urllib.request.Request(
                  request_url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              response = urllib.request.urlopen(
                  request,
                  timeout=60
              )

              raw = response.read()
              text = raw.decode("utf-8-sig")
              data = json.loads(text)

              response_data = data.get("response", {})
              header = response_data.get("header", {})

              print(
                  "API:",
                  header.get("resultCode"),
                  header.get("resultMsg")
              )

              if header.get("resultCode") != "0000":
                  raise RuntimeError(
                      "API 오류: " + str(header)
                  )

              body = response_data.get("body", {})

              total_count = int(
                  body.get("totalCount") or 0
              )

              items_container = body.get(
                  "items",
                  {}
              )

              if isinstance(
                  items_container,
                  dict
              ):
                  items = items_container.get(
                      "item",
                      []
                  )
              else:
                  items = []

              if isinstance(items, dict):
                  items = [items]

              if not isinstance(items, list):
                  items = []

              items = [
                  item
                  for item in items
                  if isinstance(item, dict)
              ]

              print(
                  "페이지 행사:",
                  len(items),
                  "/ 전체:",
                  total_count
              )

              all_items.extend(items)

              # 마지막 페이지
              if not items:
                  break

              if len(all_items) >= total_count:
                  break

              page += 1

              # 개발계정 트래픽 보호
              if page > 10:
                  print(
                      "10페이지까지만 가져옵니다."
                  )
                  break

          print(
              "API에서 받은 전체 행사:",
              len(all_items)
          )

          def pick(item, *names):
              for name in names:
                  value = item.get(name)
                  if value:
                      return value
              return ""

          events = []

          for item in all_items:

              start_date = pick(
                  item,
                  "eventstartdate"
              )

              end_date = pick(
                  item,
                  "eventenddate"
              )

              if not start_date:
                  continue

              # 우리가 원하는 기간으로 직접 필터
              if start_date < min_date:
                  continue

              if start_date > max_date:
                  continue

              address = pick(
                  item,
                  "addr1"
              )

              clean_address = address.replace(
                  "강원특별자치도 ",
                  ""
              ).replace(
                  "강원도 ",
                  ""
              )

              region = ""

              regions = [
                  "춘천",
                  "원주",
                  "강릉",
                  "동해",
                  "태백",
                  "속초",
                  "삼척",
                  "홍천",
                  "횡성",
                  "영월",
                  "평창",
                  "정선",
                  "철원",
                  "화천",
                  "양구",
                  "인제",
                  "고성",
                  "양양"
              ]

              for r in regions:
                  if (
                      clean_address.startswith(r)
                      or r + "시" in clean_address
                      or r + "군" in clean_address
                  ):
                      region = r
                      break

              event = {
                  "name": pick(
                      item,
                      "title"
                  ),

                  "region": region,

                  "type": "축제",

                  "startDate": start_date,

                  "endDate": end_date,

                  "date": (
                      f"{start_date[:4]}."
                      f"{start_date[4:6]}."
                      f"{start_date[6:]}"
                      +
                      (
                          f" ~ {end_date[:4]}."
                          f"{end_date[4:6]}."
                          f"{end_date[6:]}"
                          if end_date
                          and end_date != start_date
                          else ""
                      )
                  ),

                  "place": pick(
                      item,
                      "eventplace"
                  ),

                  "addr": address,

                  "price": pick(
                      item,
                      "usetimefestival",
                      "usetime"
                  ),

                  "img": pick(
                      item,
                      "firstimage",
                      "firstimage2"
                  ),

                  "desc": pick(
                      item,
                      "overview"
                  ),

                  "phone": pick(
                      item,
                      "tel"
                  ),

                  "contentId": pick(
                      item,
                      "contentid"
                  )
              }

              events.append(event)

          # 중복 제거
          seen = set()
          clean = []

          for event in events:

              key = (
                  event["name"],
                  event["startDate"],
                  event["place"]
              )

              if key in seen:
                  continue

              seen.add(key)
              clean.append(event)

          clean.sort(
              key=lambda x: (
                  x["startDate"],
                  x["name"]
              )
          )

          with open(
              "events.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  clean,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "최종 저장 행사:",
              len(clean)
          )

          if len(clean) == 0:
              raise RuntimeError(
                  "최종 행사 데이터가 0개입니다."
              )

          PY

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "변경된 행사 데이터가 없습니다."
          else
            git commit -m "Update Gangwon events"
            git push
          fi
