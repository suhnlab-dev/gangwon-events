name: Update Gangwon events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch KTO events
        env:
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, time
          from datetime import datetime, timedelta

          key = os.environ["KTO_API_KEY"]
          if not key:
              raise RuntimeError("KTO_API_KEY Secret이 없습니다.")

          BASE = "https://apis.data.go.kr/B551011/KorService2"
          today = datetime.now()
          min_date = "20260101"
          max_date = (today + timedelta(days=365)).strftime("%Y%m%d")

          def call(endpoint, params):
              params = dict(params)
              params.update({
                  "MobileOS": "ETC",
                  "MobileApp": "GangwonEvents",
                  "_type": "json",
                  "serviceKey": key
              })

              # 인증키가 이미 URL 인코딩된 경우를 고려
              if "%" in key:
                  encoded = urllib.parse.urlencode({
                      k:v for k,v in params.items() if k != "serviceKey"
                  })
                  url = BASE + endpoint + "?serviceKey=" + key + "&" + encoded
              else:
                  url = BASE + endpoint + "?" + urllib.parse.urlencode(params)

              for attempt in range(1,4):
                  try:
                      print(f"{endpoint} 요청 {attempt}/3")
                      req = urllib.request.Request(
                          url, headers={"User-Agent":"Mozilla/5.0"}
                      )
                      raw = urllib.request.urlopen(req, timeout=90).read()
                      data = json.loads(raw.decode("utf-8-sig"))
                      resp = data.get("response", {})
                      header = resp.get("header", {})

                      if header.get("resultCode") != "0000":
                          raise RuntimeError(str(header))

                      body = resp.get("body", {})
                      items_box = body.get("items", {})
                      items = items_box.get("item", []) if isinstance(items_box, dict) else []

                      if isinstance(items, dict):
                          items = [items]
                      if not isinstance(items, list):
                          items = []
                      items = [x for x in items if isinstance(x, dict)]

                      print(f"{endpoint}: {len(items)}개")
                      return items

                  except Exception as e:
                      print("실패:", repr(e))
                      if attempt < 3:
                          time.sleep(5)

              raise RuntimeError(endpoint + " 요청 3회 실패")

          # 1) 축제 전용 API
          festival = call("/searchFestival2", {
              "numOfRows":"1000",
              "pageNo":"1",
              "areaCode":"32",
              "eventStartDate":min_date,
              "eventEndDate":max_date
          })

          # 2) 관광정보 목록 API에서 행사/공연 타입을 보강
          area = call("/areaBasedList2", {
              "numOfRows":"1000",
              "pageNo":"1",
              "areaCode":"32",
              "contentTypeId":"15",
              "arrange":"Q"
          })

          print("searchFestival2:", len(festival))
          print("areaBasedList2:", len(area))

          def pick(x, *names):
              for n in names:
                  if x.get(n):
                      return x[n]
              return ""

          regions = [
              "춘천","원주","강릉","동해","태백","속초","삼척",
              "홍천","횡성","영월","평창","정선","철원","화천",
              "양구","인제","고성","양양"
          ]

          events = []

          # festival 데이터
          for x in festival:
              s = pick(x, "eventstartdate")
              e = pick(x, "eventenddate")
              if not s:
                  continue
              if s < min_date or s > max_date:
                  continue

              addr = pick(x, "addr1")
              clean = addr.replace("강원특별자치도 ","").replace("강원도 ","")
              region = next((r for r in regions if clean.startswith(r) or r+"시" in clean or r+"군" in clean), "")

              events.append({
                  "name": pick(x,"title"),
                  "region": region,
                  "type": "축제",
                  "startDate": s,
                  "endDate": e,
                  "date": f"{s[:4]}.{s[4:6]}.{s[6:]}" + (f" ~ {e[:4]}.{e[4:6]}.{e[6:]}" if e and e != s else ""),
                  "place": pick(x,"eventplace"),
                  "addr": addr,
                  "price": pick(x,"usetimefestival","usetime"),
                  "img": pick(x,"firstimage","firstimage2"),
                  "desc": pick(x,"overview"),
                  "phone": pick(x,"tel"),
                  "contentId": pick(x,"contentid")
              })

          # areaBasedList2는 행사 상세 날짜가 없는 항목이 많으므로
          # 날짜가 있는 항목만 추가하여 현재 events.json 형식과 맞춤
          for x in area:
              s = pick(x, "eventstartdate")
              e = pick(x, "eventenddate")
              name = pick(x, "title")

              if not name or not s:
                  continue
              if s < min_date or s > max_date:
                  continue

              addr = pick(x, "addr1")
              clean = addr.replace("강원특별자치도 ","").replace("강원도 ","")
              region = next((r for r in regions if clean.startswith(r) or r+"시" in clean or r+"군" in clean), "")

              events.append({
                  "name": name,
                  "region": region,
                  "type": "행사",
                  "startDate": s,
                  "endDate": e,
                  "date": f"{s[:4]}.{s[4:6]}.{s[6:]}" + (f" ~ {e[:4]}.{e[4:6]}.{e[6:]}" if e and e != s else ""),
                  "place": pick(x,"eventplace","addr2"),
                  "addr": addr,
                  "price": pick(x,"usetimefestival","usetime"),
                  "img": pick(x,"firstimage","firstimage2"),
                  "desc": pick(x,"overview"),
                  "phone": pick(x,"tel"),
                  "contentId": pick(x,"contentid")
              })

          # 중복 제거: contentId 우선, 없으면 이름+시작일+장소
          seen = set()
          clean_events = []

          for x in events:
              key2 = ("id", x["contentId"]) if x["contentId"] else (
                  "text", x["name"], x["startDate"], x["place"]
              )
              if key2 in seen:
                  continue
              seen.add(key2)
              clean_events.append(x)

          clean_events.sort(key=lambda x:(x["startDate"], x["name"]))

          print("중복 제거 후:", len(clean_events))

          if not clean_events:
              raise RuntimeError("최종 행사 데이터가 0개입니다.")

          with open("events.json","w",encoding="utf-8") as f:
              json.dump(clean_events, f, ensure_ascii=False, indent=2)

          PY

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "변경된 행사 데이터가 없습니다."
          else
            git commit -m "Update Gangwon events"
            git push
          fi
