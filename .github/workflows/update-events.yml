name: Update Gangwon events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch KTO events
        env:
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import time

          key = os.environ["KTO_API_KEY"]

          if not key:
              raise RuntimeError("KTO_API_KEY Secret이 없습니다.")

          BASE_URL = "https://apis.data.go.kr/B551011/KorService2/searchFestival2"

          # 조회 기간을 여러 구간으로 분할
          periods = [
              ("20260101", "20260630"),
              ("20260701", "20261231"),
              ("20270101", "20270630"),
              ("20270701", "20270831"),
          ]

          all_items = []

          def fetch_period(start_date, end_date):

              params = {
                  "MobileOS": "ETC",
                  "MobileApp": "GangwonEvents",
                  "_type": "json",
                  "numOfRows": "1000",
                  "pageNo": "1",
                  "areaCode": "32",
                  "eventStartDate": start_date,
                  "eventEndDate": end_date
              }

              query = urllib.parse.urlencode(params)

              if "%" in key:
                  url = (
                      BASE_URL
                      + "?serviceKey="
                      + key
                      + "&"
                      + query
                  )
              else:
                  url = (
                      BASE_URL
                      + "?"
                      + urllib.parse.urlencode(
                          {"serviceKey": key}
                      )
                      + "&"
                      + query
                  )

              for attempt in range(1, 4):

                  try:
                      print(
                          f"요청 {start_date} ~ {end_date}"
                          f" / 시도 {attempt}/3"
                      )

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0"
                          }
                      )

                      response = urllib.request.urlopen(
                          request,
                          timeout=90
                      )

                      raw = response.read()

                      text = raw.decode(
                          "utf-8-sig"
                      )

                      data = json.loads(text)

                      response_data = data.get(
                          "response",
                          {}
                      )

                      header = response_data.get(
                          "header",
                          {}
                      )

                      print(
                          "결과:",
                          header.get("resultCode"),
                          header.get("resultMsg")
                      )

                      if header.get(
                          "resultCode"
                      ) != "0000":

                          raise RuntimeError(
                              "API 오류: "
                              + str(header)
                          )

                      body = response_data.get(
                          "body",
                          {}
                      )

                      items_container = body.get(
                          "items",
                          {}
                      )

                      if isinstance(
                          items_container,
                          dict
                      ):
                          items = items_container.get(
                              "item",
                              []
                          )
                      else:
                          items = []

                      if isinstance(items, dict):
                          items = [items]

                      if not isinstance(items, list):
                          items = []

                      items = [
                          x for x in items
                          if isinstance(x, dict)
                      ]

                      print(
                          "가져온 행사:",
                          len(items)
                      )

                      return items

                  except Exception as e:

                      print(
                          "요청 실패:",
                          repr(e)
                      )

                      if attempt < 3:
                          time.sleep(5)

              raise RuntimeError(
                  f"{start_date} ~ {end_date} "
                  "API 요청 3회 실패"
              )

          # 기간별 수집
          for start_date, end_date in periods:

              items = fetch_period(
                  start_date,
                  end_date
              )

              all_items.extend(items)

              time.sleep(1)

          print(
              "전체 원본 행사:",
              len(all_items)
          )

          def pick(item, *names):

              for name in names:

                  value = item.get(name)

                  if value:
                      return value

              return ""

          regions = [
              "춘천",
              "원주",
              "강릉",
              "동해",
              "태백",
              "속초",
              "삼척",
              "홍천",
              "횡성",
              "영월",
              "평창",
              "정선",
              "철원",
              "화천",
              "양구",
              "인제",
              "고성",
              "양양"
          ]

          events = []

          for item in all_items:

              start_date = pick(
                  item,
                  "eventstartdate"
              )

              end_date = pick(
                  item,
                  "eventenddate"
              )

              if not start_date:
                  continue

              address = pick(
                  item,
                  "addr1"
              )

              clean_address = (
                  address
                  .replace(
                      "강원특별자치도 ",
                      ""
                  )
                  .replace(
                      "강원도 ",
                      ""
                  )
              )

              region = ""

              for r in regions:

                  if (
                      clean_address.startswith(r)
                      or r + "시" in clean_address
                      or r + "군" in clean_address
                  ):
                      region = r
                      break

              event = {
                  "name": pick(
                      item,
                      "title"
                  ),

                  "region": region,

                  "type": "축제",

                  "startDate": start_date,

                  "endDate": end_date,

                  "date": (
                      f"{start_date[:4]}."
                      f"{start_date[4:6]}."
                      f"{start_date[6:]}"
                      +
                      (
                          f" ~ {end_date[:4]}."
                          f"{end_date[4:6]}."
                          f"{end_date[6:]}"
                          if end_date
                          and end_date != start_date
                          else ""
                      )
                  ),

                  "place": pick(
                      item,
                      "eventplace"
                  ),

                  "addr": address,

                  "price": pick(
                      item,
                      "usetimefestival",
                      "usetime"
                  ),

                  "img": pick(
                      item,
                      "firstimage",
                      "firstimage2"
                  ),

                  "desc": pick(
                      item,
                      "overview"
                  ),

                  "phone": pick(
                      item,
                      "tel"
                  ),

                  "contentId": pick(
                      item,
                      "contentid"
                  )
              }

              events.append(event)

          # 중복 제거
          seen = set()
          clean = []

          for event in events:

              unique_key = (
                  event["name"],
                  event["startDate"],
                  event["place"]
              )

              if unique_key in seen:
                  continue

              seen.add(unique_key)
              clean.append(event)

          clean.sort(
              key=lambda x: (
                  x["startDate"],
                  x["name"]
              )
          )

          print(
              "최종 저장 행사:",
              len(clean)
          )

          # 데이터가 아예 없으면 기존 파일 보호
          if len(clean) == 0:

              raise RuntimeError(
                  "새 행사 데이터가 0개라 "
                  "기존 events.json을 보호합니다."
              )

          with open(
              "events.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  clean,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          PY

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "변경된 행사 데이터가 없습니다."
          else
            git commit -m "Update Gangwon events"
            git push
          fi
